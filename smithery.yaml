# Smithery configuration for Cálculo de Pensão Alimentícia
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_calculo-pensao-alimenticia

name: calculo-pensao-alimenticia-mcp
displayName: "Cálculo de Pensão Alimentícia"
description: >
  **Cálculo de pensão alimentícia** para IA. Converta pensão fixada em salários mínimos para o valor vigente e atualize parcelas em atraso com correção e juros. Salário mínimo e índices ao vivo, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/calculo-pensao-alimenticia-mcp
repository: https://github.com/mcp-dir/calculo-pensao-alimenticia-mcp

tags:
  - juridico
  - legal
  - pensao-alimenticia
  - salario-minimo
  - familia
  - brazil
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_calculo-pensao-alimenticia

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_calculo-pensao-alimenticia/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
